      #marketplace-column-2 [class*="text-[#006A4E]"][class*="font-black"],
      #marketplace-column-2-seller [class*="text-[#006A4E]"][class*="font-black"] {
        font-size: 14.5px !important;
        font-weight: 600 !important;
      }
      @media (min-width: 1024px) {
        #marketplace-column-2 [class*="text-[#006A4E]"][class*="font-bold"],
        #marketplace-column-2-seller [class*="text-[#006A4E]"][class*="font-bold"],
        #marketplace-column-2 [class*="text-blue-600"][class*="font-bold"],
        #marketplace-column-2-seller [class*="text-blue-600"][class*="font-bold"] {
          font-size: 15px !important;
        }
      }

      /* প্রিমিয়াম ও অন্যান্য ব্যাজ: নামের সমান সাইজ */
      #marketplace-column-2 span[class*="text-[#006A4E]"],
      #marketplace-column-2-seller span[class*="text-[#006A4E]"],
      #marketplace-column-2 span[class*="text-blue-600"],
      #marketplace-column-2-seller span[class*="text-blue-600"] {
        font-size: 13.5px !important;
      }

      /* =========================================================
         ৬. পোস্টের নিচের সেকশন: মধ্য দিয়ে কোনো দাগ নেই ও বাটন বর্ডারহীন (FACEBOOK CLEAN BUTTONS)
         ========================================================= */
      /* মাক করা পুরাটার মধ্য দিয়ে বা উপরে কোনো বিভাজক দাগ থাকবে না */
      #marketplace-column-2 .grid-cols-3,
      #marketplace-column-2-seller .grid-cols-3,
      #marketplace-column-2 [class*="grid-cols-3"][class*="border-t"],
      #marketplace-column-2-seller [class*="grid-cols-3"][class*="border-t"] {
        border-top: none !important;
        border-top-width: 0 !important;
        border-color: transparent !important;
      }

      /* বাটনগুলোতে কোনো বর্ডার থাকবে না, ফেইসবুকের মত হালকা কালো টেক্সট ও ক্লিন হালকা ব্যাকগ্রাউন্ড */
      #marketplace-column-2 .grid-cols-3 button,
      #marketplace-column-2-seller .grid-cols-3 button,
      #marketplace-column-2 button[title="আপভোট"],
      #marketplace-column-2-seller button[title="আপভোট"],
      #marketplace-column-2 button[title="ডাউনভোট"],
      #marketplace-column-2-seller button[title="ডাউনভোট"] {
        border: none !important;
        outline: none !important;
        box-shadow: none !important;
        background-color: #f1f5f9 !important;
        color: #475569 !important; /* ফেইসবুকের মত হালকা কালো */
        font-size: 13px !important;
        font-weight: 500 !important;
        padding: 7px 12px !important;
        border-radius: 8px !important;
        transition: background-color 0.15s ease, color 0.15s ease !important;
      }
      .dark #marketplace-column-2 .grid-cols-3 button,
      .dark #marketplace-column-2-seller .grid-cols-3 button,
      .dark #marketplace-column-2 button[title="আপভোট"],
      .dark #marketplace-column-2-seller button[title="আপভোট"],
      .dark #marketplace-column-2 button[title="ডাউনভোট"],
      .dark #marketplace-column-2-seller button[title="ডাউনভোট"] {
        background-color: #1e293b !important;
        color: #94a3b8 !important;
      }
      #marketplace-column-2 .grid-cols-3 button:hover,
      #marketplace-column-2-seller .grid-cols-3 button:hover {
        background-color: #e2e8f0 !important;
        color: #1e293b !important;
      }
      .dark #marketplace-column-2 .grid-cols-3 button:hover,
      .dark #marketplace-column-2-seller .grid-cols-3 button:hover {
        background-color: #334155 !important;
        color: #f1f5f9 !important;
      }

      /* বাটনগুলোর ভেতরের আইকন হালকা কালো */
      #marketplace-column-2 .grid-cols-3 button svg,
      #marketplace-column-2-seller .grid-cols-3 button svg {
        color: #64748b !important;
      }
      .dark #marketplace-column-2 .grid-cols-3 button svg,
      .dark #marketplace-column-2-seller .grid-cols-3 button svg {
        color: #94a3b8 !important;
      }

      /* ৩য় বাটন (বিস্তারিত): বায়ার মোডে সবুজ (#006A4E), সেলার মোডে নীল (#0084FF) */
      #marketplace-column-2 .grid-cols-3 button:last-child,
      #marketplace-column-2 button[title="বিস্তারিত"] {
        background-color: #006A4E !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        border: none !important;
      }
      #marketplace-column-2 .grid-cols-3 button:last-child:hover,
      #marketplace-column-2 button[title="বিস্তারিত"]:hover {
        background-color: #00543e !important;
        color: #ffffff !important;
      }

      /* সেলার মোডে ৩য় বাটন নীল */
      #marketplace-column-2-seller .grid-cols-3 button:last-child,
      #marketplace-column-2-seller button[title="বিস্তারিত"],
      html.marketplace-seller-mode #marketplace-column-2 .grid-cols-3 button:last-child,
      html.marketplace-seller-mode #marketplace-column-2 button[title="বিস্তারিত"] {
        background-color: #0084ff !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        border: none !important;
      }
      #marketplace-column-2-seller .grid-cols-3 button:last-child:hover,
      #marketplace-column-2-seller button[title="বিস্তারিত"]:hover,
      html.marketplace-seller-mode #marketplace-column-2 .grid-cols-3 button:last-child:hover,
      html.marketplace-seller-mode #marketplace-column-2 button[title="বিস্তারিত"]:hover {
        background-color: #0073e6 !important;
        color: #ffffff !important;
      }

      /* অযথা ডট জ্বলা-নেভা (blinking/flashing/pulsing) সম্পূর্ণ বন্ধ - স্থির ও শান্ত ডট */
      .animate-ping,
      [class*="animate-ping"] {
        display: none !important;
      }
      .animate-pulse,
      [class*="animate-pulse"] {
        animation: none !important;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased font-sans selection:bg-[#1DB954] selection:text-white">
    <div id="root"></div>
  </body>
